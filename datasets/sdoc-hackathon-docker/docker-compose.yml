services:
  inbox:
    build:
      context: ./server
    ports:
      - "8080:8000"
    volumes:
      - ./data_v2:/data:ro
      - ./data_v2/ground_truth.json:/secrets/ground_truth.json:ro
    environment:
      DATA_DIR: /data
      GROUND_TRUTH: /secrets/ground_truth.json
    restart: unless-stopped


  shipsure:
    build:
      context: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATA_SOURCE: DOCKER
      DATA_API_URL: http://inbox:8000
    depends_on:
      - inbox
    restart: unless-stopped

